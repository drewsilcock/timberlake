# https://taskfile.dev
version: '3'

vars:
  BINARY_NAME: timberlake
  # Keep in sync with .github/workflows/ci.yml (golangci-lint-action version).
  GOLANGCI_VERSION: v2.12.2

tasks:
  default:
    desc: Default task to build Timberlake
    cmds:
      - task: build

  build:
    desc: Build the Timberlake binary (No Strings Attached)
    cmds:
      - go build -o {{.BINARY_NAME}} main.go
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY_NAME}}'

  test:
    desc: Run unit and always-on integration tests (local + in-process SFTP)
    cmds:
      - go test ./...

  test-integration:
    desc: Run all tests incl. S3 backend against a throwaway MinIO container
    cmds:
      - docker rm -f tl-test-minio 2>/dev/null || true
      - docker run -d --name tl-test-minio -p 9100:9000 -e MINIO_ROOT_USER=testkey -e MINIO_ROOT_PASSWORD=testsecret123 minio/minio server /data
      - sleep 3
      - docker run --rm --network host -e AWS_ACCESS_KEY_ID=testkey -e AWS_SECRET_ACCESS_KEY=testsecret123 amazon/aws-cli --endpoint-url http://localhost:9100 s3 mb s3://tlbucket || true
      - defer: docker rm -f tl-test-minio
      - >-
        TL_S3_ENDPOINT=http://localhost:9100 TL_S3_BUCKET=tlbucket
        AWS_ACCESS_KEY_ID=testkey AWS_SECRET_ACCESS_KEY=testsecret123
        go test ./...

  clean:
    desc: Remove built binaries and cleanup temporary artifacts (Bye Bye Bye!)
    cmds:
      - rm -f {{.BINARY_NAME}}

  run:
    desc: Run Timberlake binary with --help
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}} --help

  fmt:
    desc: Format all Go source files
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet to check code sanity
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (pinned to GOLANGCI_VERSION, matching CI)
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}} run ./...

  check:
    desc: Run fmt, vet, lint, and tests (It's Gonna Be Me!)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  update-cloudflared:
    desc: Re-pin the cloudflared version and checksums used by assisted install
    vars:
      VERSION: '{{.VERSION | default "latest"}}'
    cmds:
      - |
        set -e
        V="{{.VERSION}}"
        if [ "$V" = "latest" ]; then
          V=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
        fi
        echo "cloudflared $V — put these into web/install.go:"
        echo ""
        for A in cloudflared-darwin-arm64.tgz cloudflared-darwin-amd64.tgz \
                 cloudflared-linux-amd64 cloudflared-linux-arm64 cloudflared-windows-amd64.exe; do
          SUM=$(curl -sL "https://github.com/cloudflare/cloudflared/releases/download/$V/$A" | shasum -a 256 | awk '{print $1}')
          printf '  %-34s %s\n' "$A" "$SUM"
        done
